# Local, fully containerised stack:  docker compose up --build
#   Kong gateway  -> http://localhost:8000   (ALL REST traffic, Swagger at /api/docs)
#   MCP server    -> http://localhost:8001/mcp
# The Tuition API and PostgreSQL are NOT published on the host: they are reachable only through Kong.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tuition
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition -d tuition"]
      interval: 3s
      retries: 20

  tuition-api:
    build: ./services/tuition_api
    environment:
      DATABASE_URL: postgresql+psycopg://tuition:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/tuition
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-tuition-auth}
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres: {condition: service_healthy}

  mcp-server:
    build: ./services/mcp_server
    ports: ["${MCP_HOST_PORT:-8001}:8001"]

  kong:
    build: ./gateway/kong
    environment:
      TUITION_API_URL: http://tuition-api:8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-tuition-auth}
      MOBILE_DAILY_LIMIT: "3"
    ports: ["8000:8000"]
    depends_on: [tuition-api]

  # Optional: run the CLI agent in a container instead of locally
  #   docker compose run --rm agent --demo
  agent:
    build: ./agent
    profiles: ["agent"]
    stdin_open: true
    tty: true
    environment:
      GATEWAY_URL: http://kong:8000
      MCP_URL: http://mcp-server:8001/mcp
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      TRACE_DIR: /traces
    volumes: ["./traces:/traces"]
    depends_on: [kong, mcp-server]

volumes:
  pgdata:
